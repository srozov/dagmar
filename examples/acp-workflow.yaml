id: acp-example

executors:
  claude-acp:
    type: acp
    # No `cwd`: the agent works in the run's directory (`dagmar run acp-example --cwd <dir>`).
    # An executor that always works in one place sets `cwd: /absolute/path` instead.
    # The ACP adapters (claude-agent-acp, openclaw) are host-provided executables, NOT dagmar
    # dependencies: install and authenticate them out-of-band and point `run` at them here, e.g.
    #   run: [node, /abs/path/to/@agentclientprotocol/claude-agent-acp/dist/index.js]
    #   run: [/absolute/path/to/openclaw, acp]
    run: [node, /absolute/path/to/claude-agent-acp/dist/index.js]
    # Optional: the model, applied via the agent's ACP model selector. Must be a value the
    # agent offers exactly — the list depends on the adapter version and account (claude-agent-acp
    # 0.84.0 offered: default = opus = Opus 5.5, sonnet = Sonnet 5.5, haiku, and pinned IDs such as
    # claude-fable-5-1 and claude-sonnet-5). An unknown value fails the task with acp_model_unknown,
    # listing the offered values.
    # model: opus
    # Optional: the mode, applied via the agent's ACP mode selector with the same exact-value
    # checks (acp_mode_unknown lists the offered values). For claude-agent-acp this is the
    # permission mode; 0.84.0 offers default, acceptEdits, plan, auto and bypassPermissions.
    # mode: acceptEdits
    # To route one executor to another Anthropic-compatible provider, set it in this executor's
    # `env` (the agent passes it on to Claude Code), not in a settings file in the working
    # directory, which would apply to every executor using that directory:
    #   env: { ANTHROPIC_BASE_URL: https://provider.example/anthropic, ANTHROPIC_AUTH_TOKEN: <key> }
    # An `env` block in a Claude settings file overrides this env. Check the model values the
    # agent offers under that provider (scratchpad/probe-acp-agent.mjs) before setting `model`.

tasks:
  identify:
    executor: claude-acp
    inputs:
      request: $run.input
    prompt: |
      This is a harmless ACP connectivity check. Using the supplied inputs,
      put a short identifier for yourself (your model or agent name) in the
      result output. Do not use any tools.
    session:
      mode: fresh
