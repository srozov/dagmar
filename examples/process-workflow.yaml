# Run from this checkout: the tasks call examples/process-result.mjs by a relative path. Replace
# /ABSOLUTE/PATH/TO/dagmar with the checkout's absolute path.
id: process-example
executors:
  local-process:
    type: process
    cwd: /ABSOLUTE/PATH/TO/dagmar
tasks:
  first:
    executor: local-process
    inputs:
      request: $run.input
    run: [node, examples/process-result.mjs]
  second:
    executor: local-process
    dependsOn: [first]
    inputs:
      previous: $tasks.first.output
    run: [node, examples/process-result.mjs]
