# Example dagmar daemon configuration.
#
# Copy to ~/.config/dagmar/config.yaml (or pass `dagmard --config <path>`) and
# edit the absolute paths for your machine. workflowDir, storageDir, every
# executor `cwd`, and each ACP `run` argv must be ABSOLUTE.
#
# The ACP adapters (claude-agent-acp, openclaw) are host-provided executables,
# NOT dagmar dependencies — install/authenticate them out-of-band and point
# `run` at them here.

workflowDir: /absolute/path/to/workflows
storageDir: /absolute/path/to/dagmar-state

listen:
  host: 127.0.0.1
  port: 7331

executors:
  local-process:
    type: process
    cwd: /absolute/path/to/working/dir
    env: {}

  claude-acp:
    type: acp
    cwd: /absolute/path/to/working/dir
    # Point at the claude-agent-acp adapter installed on this host, e.g.
    #   run: [node, /abs/path/to/@agentclientprotocol/claude-agent-acp/dist/index.js]
    run: [node, /absolute/path/to/claude-agent-acp/dist/index.js]
    env: {}
    # Optional: the model, applied via the agent's ACP model selector. Must be a value the
    # agent offers exactly — the list depends on the adapter version and account (claude-agent-acp
    # 0.84.0 offered: default = opus = Opus 5.5, sonnet = Sonnet 5.5, haiku, and pinned IDs such as
    # claude-fable-5-1 and claude-sonnet-5). An unknown value fails the task with acp_model_unknown,
    # listing the offered values.
    # model: opus
    # Optional: the mode, applied via the agent's ACP mode selector with the same exact-value
    # checks (acp_mode_unknown lists the offered values). For claude-agent-acp this is the
    # permission mode; 0.84.0 offers default, acceptEdits, plan, auto and bypassPermissions.
    # mode: acceptEdits

  openclaw-acp:
    type: acp
    cwd: /absolute/path/to/working/dir
    run: [/absolute/path/to/openclaw, acp]
    env: {}
